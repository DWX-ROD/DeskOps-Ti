<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer accent border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#blueGlow)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Monitor / Terminal screen frame -->
  <g filter="url(#shadow)">
    <!-- Monitor Bezel -->
    <rect x="96" y="112" width="320" height="224" rx="28" fill="#1e293b" stroke="#334155" stroke-width="6"/>
    <!-- Screen -->
    <rect x="114" y="130" width="284" height="172" rx="16" fill="#090d16"/>
    
    <!-- Terminal Header Dots -->
    <circle cx="138" cy="150" r="6" fill="#ef4444"/>
    <circle cx="156" cy="150" r="6" fill="#f59e0b"/>
    <circle cx="174" cy="150" r="6" fill="#10b981"/>

    <!-- Terminal Command / Prompt Line -->
    <path d="M 140 186 L 156 198 L 140 210" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="170" y1="210" x2="220" y2="210" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Status Badge (Sheets & Tickets) -->
    <rect x="250" y="176" width="130" height="40" rx="8" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <circle cx="268" cy="196" r="6" fill="#10b981"/>
    <rect x="284" y="190" width="76" height="6" rx="3" fill="#94a3b8"/>
    <rect x="284" y="202" width="50" height="4" rx="2" fill="#64748b"/>

    <!-- Helpdesk Ticket Icon Overlay -->
    <g transform="translate(140, 230)">
      <rect x="0" y="0" width="110" height="52" rx="8" fill="#1d4ed8" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
      <path d="M 16 26 L 30 40 L 52 14" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="62" y="22" width="34" height="5" rx="2.5" fill="#93c5fd"/>
      <rect x="62" y="32" width="24" height="4" rx="2" fill="#60a5fa"/>
    </g>

    <!-- Monitor Stand -->
    <path d="M 232 336 L 220 390 L 292 390 L 280 336 Z" fill="#334155"/>
    <rect x="180" y="390" width="152" height="16" rx="8" fill="#475569"/>
  </g>

  <!-- Floating Glowing Badge: DeskOps TI -->
  <g transform="translate(196, 420)">
    <rect x="-40" y="0" width="200" height="44" rx="22" fill="url(#blueGlow)" filter="url(#shadow)"/>
    <text x="60" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">DESKOPS TI</text>
  </g>
</svg>
